<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="RegNav.AI - AI-Powered Regulatory Compliance Navigator"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>RegNav.AI</title>
    <script>
      // Restore path from GitHub Pages 404 redirect
      (function () {
        var p = window.location.search.slice(1).split('&').find(function (s) { return s.startsWith('p='); });
        if (p) {
          window.history.replaceState(null, null, '/' + decodeURIComponent(p.slice(2)));
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
