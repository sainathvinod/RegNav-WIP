[project]
name = "regnav-backend"
version = "0.1.0"
description = "RegNav.AI backend API and agent workers"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "azure-identity>=1.19.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-storage-blob>=12.24.0",
    "pgvector>=0.3.0",
    "openai>=1.50.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pypdf>=4.3",
]

[project.optional-dependencies]
# Docling (IBM) — structured PDF extraction with table & layout awareness.
# Installed in the worker image; not required for unit tests.
docling = [
    "docling>=2.10.0",
]
# Playwright — used in the worker to render HTML pages to PDF for archival.
# Browser binaries are installed separately via `playwright install chromium`.
htmlpdf = [
    "playwright>=1.49.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.2",
]
otel = [
    # OpenTelemetry — install with ``pip install -e ".[otel]"`` for prod.
    # Local dev runs without these and the tracer falls back to no-op.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",
    "B008",   # FastAPI Depends() in function signatures is idiomatic
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
