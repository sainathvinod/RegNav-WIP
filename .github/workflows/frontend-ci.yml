name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'regnav-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'regnav-frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: regnav-frontend

jobs:
  build:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: regnav-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --passWithNoTests
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # E2E tests via Playwright (Chromium, API mocked via page.route)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: regnav-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build app (dev-bypass mode, no auth)
        run: npm run build
        env:
          VITE_AUTH_CLIENT_ID: ''
          VITE_AUTH_AUTHORITY: ''
          VITE_API_BASE_URL: ''

      - name: Run E2E tests
        run: npm run e2e:ci

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: regnav-frontend/playwright-report/
          retention-days: 7
