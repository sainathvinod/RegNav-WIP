name: Deploy to Azure Container Apps

# Triggers on push to main after CI passes, or can be dispatched manually.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-aca.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

env:
  # Set these repository secrets in GitHub → Settings → Secrets:
  # AZURE_CLIENT_ID        — service-principal app ID (Workload Identity preferred)
  # AZURE_TENANT_ID        — Azure AD tenant ID
  # AZURE_SUBSCRIPTION_ID  — subscription that owns the ACR and Container App
  # ACR_LOGIN_SERVER       — e.g. regnav.azurecr.io
  # ACA_NAME               — e.g. regnav-backend
  # ACA_RESOURCE_GROUP     — e.g. regnav-rg
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # -------------------------------------------------------------------------
  # Build & push backend image to Azure Container Registry
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build backend image
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC / Workload Identity
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/regnav-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/regnav-backend:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/regnav-backend:latest
          cache-to: type=inline

  # -------------------------------------------------------------------------
  # Deploy to Azure Container Apps
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ secrets.ACA_NAME }} \
            --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/regnav-backend:${{ env.IMAGE_TAG }}

      - name: Wait for revision to be ready
        run: |
          az containerapp revision list \
            --name ${{ secrets.ACA_NAME }} \
            --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
            --query "[0].properties.runningState" -o tsv

      - name: Run database migrations
        run: |
          az containerapp job start \
            --name ${{ secrets.ACA_NAME }}-migrate \
            --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/regnav-backend:${{ env.IMAGE_TAG }} \
            --command "alembic" "upgrade" "head" || \
          echo "::warning::Migration job not configured — run alembic upgrade head manually"

      - name: Smoke-test readiness probe
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ secrets.ACA_NAME }} \
            --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Checking https://${APP_URL}/ready …"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${APP_URL}/ready" || echo 000)
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Readiness probe failed after 5 attempts"
          exit 1
