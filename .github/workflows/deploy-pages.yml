name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/repo-code-explanation-DZK1m]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: regnav-frontend/package-lock.json

      - name: Install dependencies
        working-directory: regnav-frontend
        run: npm install

      - name: Build
        working-directory: regnav-frontend
        env:
          VITE_BASE_PATH: /RegNav-WIP/
          VITE_API_BASE_URL: http://localhost:8000
          VITE_APP_ENV: production
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: regnav-frontend/dist
          force_orphan: true
